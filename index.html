<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <style>
        body { background: #0a0a0a; color: #d4af37; font-family: 'Segoe UI', sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: #161616; padding: 30px; border-radius: 15px; text-align: center; border: 1px solid #d4af37; box-shadow: 0 0 20px rgba(212, 175, 55, 0.2); width: 350px; }
        img { width: 80px; border-radius: 15px; border: 2px solid #d4af37; margin-bottom: 10px; }
        h2 { margin: 5px 0; color: #d4af37; text-transform: uppercase; letter-spacing: 2px; }
        .key-box { border: 2px solid #d4af37; padding: 20px; margin: 20px 0; font-size: 1.2em; font-weight: bold; background: #000; letter-spacing: 3px; box-shadow: inset 0 0 10px #d4af37; }
        .btn { background: #d4af37; color: #000; border: none; padding: 12px 20px; cursor: pointer; font-weight: bold; border-radius: 5px; width: 100%; margin-top: 10px; }
        .btn:hover { background: #b8962d; }
        a { color: #d4af37; text-decoration: none; font-size: 0.9em; }
    </style>
</head>
<body>

<div class="card">
    <img src="https://viku.mypdftools.site/uploads/valimods1/IMG_20260408_154428_252.jpg">
    <h2>VALI MODS</h2>
    <p>AUTHORIZED ACCESS SYSTEM</p>
    
    <a href="https://chat.whatsapp.com/BxcVsfymjhD6NHdlwbBXom" target="_blank">🔗 ENTRAR NO GRUPO</a>
    
    <div class="key-box" id="keyDisplay">VALIMODS-XXXX-XXXX-6H</div>
    
    <button class="btn" onclick="gerarKey()">GERAR KEY (6H)</button>
</div>

<script>
    function gerarKey() {
        const part = () => Math.random().toString(36).substring(2, 6).toUpperCase();
        const key = `VALIMODS-${part()}-${part()}-6H`;
        document.getElementById("keyDisplay").innerText = key;
    }
</script>
</body>
</html>
