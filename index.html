<!DOCTYPE html>
<html lang="pt-br">
<head>

        .card { 
            background: #111; padding: 30px; border-radius: 20px; text-align: center;
            border: 2px solid #bc13fe; box-shadow: 0 0 25px #bc13fe;
            width: 350px;
        }
        img { width: 120px; border-radius: 50%; border: 3px solid #bc13fe; margin-bottom: 15px; }
        h1 { color: #bc13fe; text-shadow: 0 0 10px #bc13fe; margin: 10px 0; }
        a { color: #bc13fe; text-decoration: underline; font-weight: bold; display: block; margin: 10px 0; }
        button { 
            background: #bc13fe; border: none; color: white; padding: 12px 25px; 
            margin-top: 15px; cursor: pointer; border-radius: 8px; font-weight: bold;
            width: 100%; transition: 0.3s;
        }
        button:hover { background: #9a0fd3; box-shadow: 0 0 15px #bc13fe; }
        #result { margin-top: 20px; padding: 15px; border: 1px dashed #bc13fe; color: #fff; font-family: monospace; }
    </style>
</head>
<body>

<div class="card">
    <img src="https://i.pinimg.com/736x/7a/cf/7a/7acf7a484eefc490e9f968b10ab94fb0.jpg">
    <h1>VORTEX CRACKED</h1>
    <p>Entre no grupo para liberar o acesso:</p>
    <a href="https://chat.whatsapp.com/BxcVsfymjhD6NHdlwbBXom">ACESSAR GRUPO</a>
    
    <button onclick="gerarKeyDemo()">GERAR KEY (6H)</button>
    
    <div id="result">Clique para gerar</div>
</div>

<script>
    function gerarKeyDemo() {
        const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";
        let key = "VORTEX-";

        for(let i = 0; i < 4; i++) {
            for(let j = 0; j < 4; j++) {
                key += chars[Math.floor(Math.random() * chars.length)];
            }
            if(i < 3) key += "-";
        }

        document.getElementById("result").innerHTML = 
            `<strong>KEY GERADA:</strong><br><span style="color:#bc13fe; font-size: 1.2em;">${key}</span>`;
    }
</script>
